[package]
name = "fastcog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Fast pure-Rust GeoTIFF and JP2 to COG converter"
readme = "README.md"
keywords = ["geotiff", "cog", "gdal", "raster", "jp2"]
categories = ["command-line-utilities", "science::geo"]

[lib]
name = "fastcog"
path = "src/lib.rs"

[[bin]]
name = "fastcog"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
gdal-alt-core = { path = "../crates/gdal-alt-core" }
rayon = "1.10"
anyhow = "1"
