[package]
name = "fastband"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Subset or reorder raster bands into a new COG"
readme = "README.md"

[[bin]]
name = "fastband"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gdal-alt-core = { path = "../crates/gdal-alt-core" }
