[package]
name = "fasttranslate"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Unified GDAL-free raster toolkit (cog, crop, band, info, validate)"
readme = "README.md"

[[bin]]
name = "fasttranslate"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fastcog = { path = "../fastcog" }
gdal-alt-core = { path = "../crates/gdal-alt-core" }
rayon = "1.10"
