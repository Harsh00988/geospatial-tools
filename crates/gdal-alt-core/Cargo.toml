[package]
name = "gdal-alt-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared geospatial raster I/O for gdal-alternate tools"

[dependencies]
anyhow = "1"
geotiff-core = "0.8"
geotiff-reader = { version = "0.8", features = ["rayon"] }
geotiff-writer = "0.8"
tiff-core = "0.8"
tiff-reader = "0.8"
ndarray = "0.17"
rayon = "1.10"
jpeg2k = { version = "0.10", default-features = false, features = ["openjpeg-sys", "threads"] }
memmap2 = "0.9"
indicatif = "0.17"
