[package]
name = "fastinfo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Fast raster metadata reader (gdalinfo alternative)"
readme = "README.md"

[[bin]]
name = "fastinfo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gdal-alt-core = { path = "../crates/gdal-alt-core" }
